<!-- TAG MANAGER MODAL -->
<div id="tagModal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🏷️ Tag Manager</h3>
      <button class="modal-close" onclick="closeModal('tagModal')">✕</button>
    </div>
    <div class="form-group tag-add-form">
      <input type="text" id="newTagName" placeholder="Tag name">
      <input type="color" id="newTagColor" value="#667eea" style="width:50px;">
      <button class="btn btn-sm btn-primary" onclick="addNewTag()">Add Tag</button>
    </div>
    <div id="tagManagerList" class="tag-manager-list"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('tagModal')">Close</button>
    </div>
  </div>
</div>
